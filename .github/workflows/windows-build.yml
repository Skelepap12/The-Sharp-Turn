name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build The Sharp Turn
        run: msbuild Code\TheSharpTurn.sln /t:Rebuild /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal

      - name: Upload debug build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TheSharpTurn-Debug
          path: Code\TheSharpTurn\bin\Debug\
