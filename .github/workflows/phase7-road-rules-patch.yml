name: Apply Phase 7 Road Rules

"on": [push]

permissions:
  contents: write

jobs:
  patch-road-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python Tools/phase7_patch.py

      - name: Commit patched project
        run: |
          git config user.name "Michael"
          git config user.email "mmichaeli2004@gmail.com"
          git add -A
          git commit -m "Refine road overtaking and queue fullscreen graphics task"
          git push
